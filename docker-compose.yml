version: "3.9"

services:
  db:
    image: postgres:15
    container_name: articurated-postgres
    environment:
      POSTGRES_DB: articurated
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articurated"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: maven:3.9-eclipse-temurin-21
    container_name: articurated-app
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ./:/app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/articurated
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PAYMENT_GATEWAY_URL: http://mock-gateway
      PAYMENT_GATEWAY_API_KEY: test-key
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

