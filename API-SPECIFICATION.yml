openapi: 3.0.3
info:
  title: ArtiCurated Order Management API
  version: 1.0.0
  description: >
    REST API for managing orders, payments, returns, and refunds with
    complex state management and multi-step workflows.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Orders
  - name: Payments
  - name: Returns
  - name: Refunds

paths:
  /api/orders:
    post:
      tags: [Orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error
        '500':
          description: Server error

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order by ID
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found

  /api/orders/order-number/{orderNumber}:
    get:
      tags: [Orders]
      summary: Get order by order number
      parameters:
        - in: path
          name: orderNumber
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found

  /api/orders/customer/{customerId}:
    get:
      tags: [Orders]
      summary: List orders for a customer
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

  /api/orders/{orderId}/status:
    put:
      tags: [Orders]
      summary: Update order status
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
        - in: header
          name: userId
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid state transition or business rule violation

  /api/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
        - in: header
          name: userId
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Order cannot be cancelled
        '404':
          description: Order not found

  /api/orders/{orderId}/history:
    get:
      tags: [Orders]
      summary: Get order state history
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of state transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateHistoryResponse'

  /api/payments:
    post:
      tags: [Payments]
      summary: Process a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Validation error or business rule violation
        '404':
          description: Order not found

  /api/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Get payment by ID
      parameters:
        - in: path
          name: paymentId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Payment not found

  /api/payments/order/{orderId}:
    get:
      tags: [Payments]
      summary: List payments by order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'

  /api/returns:
    post:
      tags: [Returns]
      summary: Create a return request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReturnRequest'
      responses:
        '201':
          description: Return created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'
        '400':
          description: Validation error or return not allowed
        '404':
          description: Order not found

  /api/returns/{returnId}:
    get:
      tags: [Returns]
      summary: Get return by ID
      parameters:
        - in: path
          name: returnId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Return details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'
        '404':
          description: Return not found

  /api/returns/order/{orderId}:
    get:
      tags: [Returns]
      summary: List returns by order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of returns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnResponse'

  /api/returns/{returnId}/approve:
    post:
      tags: [Returns]
      summary: Approve a return
      parameters:
        - in: path
          name: returnId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveReturnRequest'
      responses:
        '200':
          description: Approved return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'
        '400':
          description: Business rule violation
        '404':
          description: Return not found

  /api/returns/{returnId}/reject:
    post:
      tags: [Returns]
      summary: Reject a return
      parameters:
        - in: path
          name: returnId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: reason
          required: true
          schema:
            type: string
        - in: header
          name: userId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Rejected return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'

  /api/returns/{returnId}/in-transit:
    put:
      tags: [Returns]
      summary: Mark a return as in transit
      parameters:
        - in: path
          name: returnId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'

  /api/returns/{returnId}/received:
    put:
      tags: [Returns]
      summary: Mark a return as received
      parameters:
        - in: path
          name: returnId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated return
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnResponse'

  /api/returns/{returnId}/history:
    get:
      tags: [Returns]
      summary: Get return state history
      parameters:
        - in: path
          name: returnId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: List of state transitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateHistoryResponse'

  /api/refunds/return/{returnId}:
    post:
      tags: [Refunds]
      summary: Create a refund for a return
      parameters:
        - in: path
          name: returnId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '400':
          description: Business rule violation
        '404':
          description: Return not found

  /api/refunds/{refundId}:
    get:
      tags: [Refunds]
      summary: Get refund by ID
      parameters:
        - in: path
          name: refundId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Refund details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '404':
          description: Refund not found

  /api/refunds/return/{returnId}:
    get:
      tags: [Refunds]
      summary: Get refund by return ID
      parameters:
        - in: path
          name: returnId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Refund details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'

  /api/refunds/{refundId}/process:
    post:
      tags: [Refunds]
      summary: Process a refund
      parameters:
        - in: path
          name: refundId
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Processed refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '404':
          description: Refund not found

components:
  schemas:
    OrderItemRequest:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
          minimum: 1
        price:
          type: number
          format: double
      required: [productId, productName, quantity, price]

    CreateOrderRequest:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        shippingAddress:
          type: string
      required: [customerId, orderItems, shippingAddress]

    UpdateOrderStatusRequest:
      type: object
      properties:
        newStatus:
          type: string
          enum:
            - PENDING_PAYMENT
            - PAID
            - PROCESSING_IN_WAREHOUSE
            - SHIPPED
            - DELIVERED
            - CANCELLED
        reason:
          type: string
      required: [newStatus]

    ProcessPaymentRequest:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        paymentMethod:
          type: string
        amount:
          type: number
          format: double
        paymentDetails:
          type: object
          additionalProperties:
            type: string
      required: [orderId, paymentMethod, amount]

    CreateReturnRequest:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        returnReason:
          type: string
      required: [orderId, returnReason]

    ApproveReturnRequest:
      type: object
      properties:
        managerId:
          type: integer
          format: int64
        comments:
          type: string
      required: [managerId]

    OrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
        price:
          type: number
          format: double
        subtotal:
          type: number
          format: double

    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderNumber:
          type: string
        customerId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - PENDING_PAYMENT
            - PAID
            - PROCESSING_IN_WAREHOUSE
            - SHIPPED
            - DELIVERED
            - CANCELLED
        totalAmount:
          type: number
          format: double
        shippingAddress:
          type: string
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        paymentMethod:
          type: string
        amount:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED]
        transactionId:
          type: string
        processedAt:
          type: string
          format: date-time

    ReturnResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        returnReason:
          type: string
        status:
          type: string
          enum:
            - REQUESTED
            - APPROVED
            - REJECTED
            - IN_TRANSIT
            - RECEIVED
            - COMPLETED
        requestedAt:
          type: string
          format: date-time
        approvedBy:
          type: integer
          format: int64
        approvedAt:
          type: string
          format: date-time
        shippedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        comments:
          type: string

    RefundResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        returnId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED]
        refundMethod:
          type: string
        transactionId:
          type: string
        processedAt:
          type: string
          format: date-time

    StateHistoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        entityType:
          type: string
          enum: [ORDER, RETURN]
        entityId:
          type: integer
          format: int64
        fromState:
          type: string
        toState:
          type: string
        triggeredBy:
          type: string
        transitionReason:
          type: string
        timestamp:
          type: string
          format: date-time

